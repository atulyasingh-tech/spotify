<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Web Clone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Main Container Grid */
    .app-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 90px);
      padding: 8px;
      gap: 8px;
      background-color: #000;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background-color: #121212;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 24px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      color: #b3b3b3;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
    }

    /* Main Content Area */
    .main-view {
      flex: 1;
      background: linear-gradient(180deg, #1e1e1e 0%, #121212 100%);
      border-radius: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .top-bar {
      position: sticky;
      top: 0;
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #242424;
      border-radius: 500px;
      padding: 8px 16px;
      width: 320px;
      gap: 10px;
      border: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .search-box:focus-within {
      border-color: #fff;
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.875rem;
      width: 100%;
    }

    .search-box input::placeholder {
      color: #757575;
    }

    .content-area {
      padding: 24px 32px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    /* Track Grid */
    .track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .track-card {
      background-color: #181818;
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .track-card:hover {
      background-color: #282828;
    }

    .cover-container {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 14px;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .cover-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    .card-play-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #1db954;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }

    .track-card:hover .card-play-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .card-play-btn:hover {
      transform: scale(1.06);
      background-color: #1ed760;
    }

    .track-card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .track-card-artist {
      font-size: 0.8rem;
      color: #a7a7a7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 8px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .track-duration {
      font-size: 0.75rem;
      color: #757575;
    }

    .like-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #b3b3b3;
      transition: transform 0.15s ease, color 0.2s ease;
    }

    .like-btn:hover {
      color: #fff;
      transform: scale(1.15);
    }

    .like-btn.liked {
      color: #1db954;
    }

    /* Player Bar */
    .player-bar {
      height: 90px;
      background-color: #000;
      border-top: 1px solid #282828;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 30%;
      min-width: 180px;
    }

    .player-thumb {
      width: 56px;
      height: 56px;
      border-radius: 4px;
      overflow: hidden;
      background-color: #282828;
      flex-shrink: 0;
    }

    .player-thumb-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .player-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .player-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-size: 0.75rem;
      color: #b3b3b3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 40%;
      max-width: 600px;
    }

    .player-controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .control-btn {
      background: transparent;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      color: #fff;
    }

    .play-pause-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #fff;
      color: #000;
    }

    .play-pause-btn:hover {
      transform: scale(1.06);
      color: #000;
      background-color: #fff;
    }

    .playback-timeline {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-stamp {
      font-size: 0.7rem;
      color: #a7a7a7;
      width: 38px;
      text-align: center;
    }

    /* Range Slider Styling */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #4d4d4d;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .playback-timeline:hover input[type="range"]::-webkit-slider-thumb,
    .player-right:hover input[type="range"]::-webkit-slider-thumb {
      opacity: 1;
    }

    .player-right {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      width: 30%;
      min-width: 150px;
    }

    .volume-slider {
      max-width: 100px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#1DB954"><path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.586 14.424a.623.623 0 0 1-.858.207c-2.35-1.436-5.308-1.76-8.793-.963a.625.625 0 0 1-.28-1.218c3.813-.872 7.086-.503 9.724 1.116a.624.624 0 0 1 .207.858zm1.226-2.724a.78.78 0 0 1-1.073.257c-2.69-1.654-6.79-2.133-9.97-1.167a.781.781 0 0 1-.462-1.492c3.633-1.103 8.163-.574 11.248 1.328a.78.78 0 0 1 .257 1.074zm.135-2.834C14.72 8.94 8.78 8.74 5.34 9.784a.936.936 0 1 1-.546-1.792c3.96-1.202 10.534-.967 14.34 1.293a.936.936 0 0 1-.987 1.581z"/></svg>
        Spotify
      </div>
      <ul class="nav-links">
        <li class="nav-item active">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h5v-6h6v6h5V7.577l-7.5-4.33z"/></svg>
          Home
        </li>
        <li class="nav-item">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10.533 1.27893C5.35215 1.27893 1.12598 5.5051 1.12598 10.686C1.12598 15.8668 5.35215 20.093 10.533 20.093C12.8055 20.093 14.8906 19.2897 16.5194 17.9461L21.0693 22.496C21.463 22.8897 22.0962 22.8897 22.4899 22.496C22.8836 22.1023 22.8836 21.4691 22.4899 21.0754L17.94 16.5255C19.2836 14.8967 20.0869 12.8116 20.0869 10.686C20.0869 5.5051 15.8608 1.27893 10.533 1.27893ZM3.12598 10.686C3.12598 6.60835 6.4553 3.27893 10.533 3.27893C14.6106 3.27893 17.94 6.60835 17.94 10.686C17.94 14.7636 14.6106 18.093 10.533 18.093C6.4553 18.093 3.12598 14.7636 3.12598 10.686Z"/></svg>
          Search
        </li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-view">
      <div class="top-bar">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#a7a7a7"><path d="M10.533 1.27893C5.35215 1.27893 1.12598 5.5051 1.12598 10.686C1.12598 15.8668 5.35215 20.093 10.533 20.093C12.8055 20.093 14.8906 19.2897 16.5194 17.9461L21.0693 22.496C21.463 22.8897 22.0962 22.8897 22.4899 22.496C22.8836 22.1023 22.8836 21.4691 22.4899 21.0754L17.94 16.5255C19.2836 14.8967 20.0869 12.8116 20.0869 10.686C20.0869 5.5051 15.8608 1.27893 10.533 1.27893ZM3.12598 10.686C3.12598 6.60835 6.4553 3.27893 10.533 3.27893C14.6106 3.27893 17.94 6.60835 17.94 10.686C17.94 14.7636 14.6106 18.093 10.533 18.093C6.4553 18.093 3.12598 14.7636 3.12598 10.686Z"/></svg>
          <input type="text" id="search-input" placeholder="What do you want to play?">
        </div>
      </div>

      <div class="content-area">
        <h2 class="section-title">Tracks</h2>
        <div class="track-grid" id="track-grid"></div>
      </div>
    </main>
  </div>

  <!-- Bottom Player Bar -->
  <footer class="player-bar">
    <div class="player-left">
      <div class="player-thumb" id="player-thumb"></div>
      <div class="player-meta">
        <div class="player-title" id="player-title">Select a track</div>
        <div class="player-artist" id="player-artist">Ready to play</div>
      </div>
      <button class="like-btn" id="player-like-btn" title="Save to Your Library">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="control-btn" id="prev-btn" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn play-pause-btn" id="play-btn" title="Play">
          <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="control-btn" id="next-btn" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
      </div>
      <div class="playback-timeline">
        <span class="time-stamp" id="current-time">0:00</span>
        <input type="range" id="seek-bar" min="0" max="100" value="0">
        <span class="time-stamp" id="total-duration">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#b3b3b3"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <input type="range" id="volume-bar" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
    </div>
  </footer>

  <script>
    const TRACKS = [
      {
        id: 1,
        title: "Midnight Signal",
        artist: "The Nocturnes",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
        cover: "./assets/covers/cover-01.jpg",
        gradient: "linear-gradient(135deg, #450af5, #c4efd9)",
        durationHint: "6:13"
      },
      {
        id: 2,
        title: "Paper Planes",
        artist: "Kite Season",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
        cover: "./assets/covers/cover-02.jpg",
        gradient: "linear-gradient(135deg, #e11d48, #fb7185)",
        durationHint: "6:07"
      },
      {
        id: 3,
        title: "Neon Harbor",
        artist: "Violet Static",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
        cover: "./assets/covers/cover-03.jpg",
        gradient: "linear-gradient(135deg, #0d9488, #2dd4bf)",
        durationHint: "6:20"
      },
      {
        id: 4,
        title: "Slow Tide",
        artist: "Marlow Bay",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
        cover: "./assets/covers/cover-04.jpg",
        gradient: "linear-gradient(135deg, #d97706, #fde68a)",
        durationHint: "6:32"
      },
      {
        id: 5,
        title: "Copper Sky",
        artist: "Ada & the Owls",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
        cover: "./assets/covers/cover-05.jpg",
        gradient: "linear-gradient(135deg, #7c3aed, #c084fc)",
        durationHint: "6:55"
      },
      {
        id: 6,
        title: "Little Machines",
        artist: "Foxglove",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3",
        cover: "./assets/covers/cover-06.jpg",
        gradient: "linear-gradient(135deg, #2563eb, #60a5fa)",
        durationHint: "4:59"
      }
    ];

    // State Variables
    let currentTrackIndex = -1;
    let isPlaying = false;
    const audio = new Audio();
    audio.volume = 0.8;

    // Load Liked State from LocalStorage
    let likedTracks = new Set(JSON.parse(localStorage.getItem("spotify_clone_liked_tracks") || "[]"));

    // DOM Elements
    const trackGrid = document.getElementById("track-grid");
    const playBtn = document.getElementById("play-btn");
    const playIcon = document.getElementById("play-icon");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const seekBar = document.getElementById("seek-bar");
    const currentTimeEl = document.getElementById("current-time");
    const totalDurationEl = document.getElementById("total-duration");
    const volumeBar = document.getElementById("volume-bar");
    const searchInput = document.getElementById("search-input");
    const playerTitle = document.getElementById("player-title");
    const playerArtist = document.getElementById("player-artist");
    const playerThumb = document.getElementById("player-thumb");
    const playerLikeBtn = document.getElementById("player-like-btn");

    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function renderTracks(tracksToRender) {
      trackGrid.innerHTML = "";
      tracksToRender.forEach((track) => {
        const isLiked = likedTracks.has(track.id);
        const card = document.createElement("div");
        card.className = "track-card";
        card.innerHTML = `
          <div class="cover-container">
            <img class="cover-img" src="${track.cover}" alt="${track.title}" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="cover-fallback" style="display:none; background:${track.gradient};">
              ${track.title.charAt(0)}
            </div>
            <div class="card-play-btn" data-id="${track.id}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>
            </div>
          </div>
          <div class="track-card-title">${track.title}</div>
          <div class="track-card-artist">${track.artist}</div>
          <div class="card-footer">
            <span class="track-duration">${track.durationHint}</span>
            <button class="like-btn ${isLiked ? 'liked' : ''}" data-id="${track.id}" title="Like">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="${isLiked ? '#1DB954' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
          </div>
        `;

        card.addEventListener("click", (e) => {
          if (e.target.closest(".like-btn")) return;
          const idx = TRACKS.findIndex(t => t.id === track.id);
          loadAndPlayTrack(idx);
        });

        trackGrid.appendChild(card);
      });

      // Bind like buttons
      document.querySelectorAll(".card-footer .like-btn").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const trackId = parseInt(btn.dataset.id);
          toggleLike(trackId);
        });
      });
    }

    function toggleLike(trackId) {
      if (likedTracks.has(trackId)) {
        likedTracks.delete(trackId);
      } else {
        likedTracks.add(trackId);
      }
      localStorage.setItem("spotify_clone_liked_tracks", JSON.stringify([...likedTracks]));
      
      // Update Grid UI
      renderTracks(getFilteredTracks());
      updatePlayerLikeButton();
    }

    function updatePlayerLikeButton() {
      if (currentTrackIndex === -1) {
        playerLikeBtn.classList.remove("liked");
        playerLikeBtn.querySelector("svg").setAttribute("fill", "none");
        return;
      }
      const currentTrack = TRACKS[currentTrackIndex];
      const isLiked = likedTracks.has(currentTrack.id);
      playerLikeBtn.classList.toggle("liked", isLiked);
      playerLikeBtn.querySelector("svg").setAttribute("fill", isLiked ? "#1DB954" : "none");
    }

    function loadAndPlayTrack(index) {
      if (index < 0 || index >= TRACKS.length) return;
      currentTrackIndex = index;
      const track = TRACKS[currentTrackIndex];

      audio.src = track.src;
      playerTitle.textContent = track.title;
      playerArtist.textContent = track.artist;
      
      playerThumb.innerHTML = `
        <img class="player-thumb-img" src="${track.cover}" alt="${track.title}"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div style="display:none; width:100%; height:100%; background:${track.gradient}; align-items:center; justify-content:center; font-weight:bold; font-size:1.2rem;">
          ${track.title.charAt(0)}
        </div>
      `;

      updatePlayerLikeButton();
      audio.play();
      isPlaying = true;
      updatePlayButtonUI();
    }

    function updatePlayButtonUI() {
      if (isPlaying) {
        playIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      } else {
        playIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
      }
    }

    // Play / Pause Toggle
    playBtn.addEventListener("click", () => {
      if (currentTrackIndex === -1) {
        loadAndPlayTrack(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        isPlaying = true;
      } else {
        audio.pause();
        isPlaying = false;
      }
      updatePlayButtonUI();
    });

    // Next Track
    nextBtn.addEventListener("click", () => {
      if (currentTrackIndex === -1) {
        loadAndPlayTrack(0);
        return;
      }
      const nextIndex = (currentTrackIndex + 1) % TRACKS.length;
      loadAndPlayTrack(nextIndex);
    });

    // Previous Track (with 3-second rewind check)
    prevBtn.addEventListener("click", () => {
      if (currentTrackIndex === -1) {
        loadAndPlayTrack(0);
        return;
      }
      if (audio.currentTime > 3) {
        audio.currentTime = 0;
      } else {
        const prevIndex = (currentTrackIndex - 1 + TRACKS.length) % TRACKS.length;
        loadAndPlayTrack(prevIndex);
      }
    });

    // Timeline & Progress Scrubbing
    audio.addEventListener("timeupdate", () => {
      if (!isNaN(audio.duration) && audio.duration > 0) {
        const progress = (audio.currentTime / audio.duration) * 100;
        seekBar.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener("loadedmetadata", () => {
      totalDurationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener("ended", () => {
      const nextIndex = (currentTrackIndex + 1) % TRACKS.length;
      loadAndPlayTrack(nextIndex);
    });

    seekBar.addEventListener("input", () => {
      if (!isNaN(audio.duration)) {
        audio.currentTime = (seekBar.value / 100) * audio.duration;
      }
    });

    // Volume Control
    volumeBar.addEventListener("input", (e) => {
      audio.volume = parseFloat(e.target.value);
    });

    // Player Like Button
    playerLikeBtn.addEventListener("click", () => {
      if (currentTrackIndex !== -1) {
        toggleLike(TRACKS[currentTrackIndex].id);
      }
    });

    // Search Filtering
    function getFilteredTracks() {
      const q = searchInput.value.toLowerCase().trim();
      if (!q) return TRACKS;
      return TRACKS.filter(t => 
        t.title.toLowerCase().includes(q) || 
        t.artist.toLowerCase().includes(q)
      );
    }

    searchInput.addEventListener("input", () => {
      renderTracks(getFilteredTracks());
    });

    // Initial render
    renderTracks(TRACKS);
  </script>
</body>
</html>
